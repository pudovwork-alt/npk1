<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      НПК «АЗИМУТ» — Контакты
    </title>
    <!-- Оформление страницы: цвета, карточки и адаптивная версия -->
    <style>
      
      :root {
        
      }
      * {
        box-sizing:border-box
      }
      :root {
        --ink:#063f50;
        --teal:#008d99;
        --panel:rgba(247,255,255,.83);
        --tile:rgba(255,255,255,.87);
        --line:#dceff1;
        --shadow:0 12px 34px #007c8515
      }
      body {
        margin:0;
        background:radial-gradient(ellipse at 25% 50%,#cdecee,transparent 60%),linear-gradient(110deg,#effafb,#e5f9f8);
        color:var(--ink);
        font-family:Arial,Helvetica,sans-serif
      }
      body[data-theme=dark] {
        --ink:#e2fbff;
        --teal:#57d3dc;
        --panel:#102e36ed;
        --tile:#173e47ee;
        --line:#2a5861;
        background:#071f28
      }
      a {
        color:inherit;
        text-decoration:none
      }
      button {
        font:inherit;
        color:inherit;
        cursor:pointer
      }
      button,a {
        -webkit-tap-highlight-color:transparent
      }
      button:focus-visible,a:focus-visible {
        outline:3px solid #08aab9;
        outline-offset:5px
      }
      svg {
        width:30px;
        height:30px;
        fill:none;
        stroke:currentColor;
        stroke-width:1.9;
        stroke-linecap:round;
        stroke-linejoin:round
      }
      .stage {
        position:relative;
        width:1672px;
        height:941px;
        transform-origin:top left;
        overflow:hidden
      }
      .decor {
        position:absolute;
        top:0;
        bottom:0;
        width:242px;
        background-image:var(--reference);
        background-size:1672px 941px;
        pointer-events:none
      }
      .decor.left {
        left:0;
        background-position:left top
      }
      .decor.right {
        right:0;
        background-position:right top
      }
      body[data-theme=dark] .decor {
        opacity:.16
      }
      .top {
        position:absolute;
        left:64px;
        right:66px;
        top:29px;
        display:flex;
        justify-content:space-between;
        align-items:center
      }
      .controls {
        display:flex;
        gap:15px
      }
      .glass {
        height:54px;
        border:1px solid #ffffff90;
        border-radius:18px;
        background:var(--panel);
        box-shadow:0 12px 28px #006b7520
      }
      .backlink {
        display:flex;
        align-items:center;
        gap:17px;
        padding:0 24px;
        font-size:21px;
        font-weight:700
      }
      .theme {
        width:54px;
        display:grid;
        place-items:center
      }
      .languages {
        display:flex;
        padding:4px;
        gap:3px
      }
      .languages button {
        border:0;
        background:transparent;
        padding:0 24px;
        font-weight:700;
        font-size:20px;
        border-radius:13px;
        color:#6c899b
      }
      .languages button.active {
        background:linear-gradient(120deg,#007e8e,#0aa1a7);
        color:white;
        box-shadow:0 4px 10px #007c8530
      }
      .panel {
        position:absolute;
        top:115px;
        left:241px;
        width:1189px;
        height:748px;
        padding:27px 58px 32px;
        border-radius:38px;
        background:var(--panel);
        border:1px solid #ffffffce;
        box-shadow:0 28px 70px #007c851c;
        backdrop-filter:blur(14px)
      }
      .heading {
        display:flex;
        align-items:center;
        justify-content:center;
        gap:18px;
        margin:0;
        color:#007c8b;
        font-size:21px;
        letter-spacing:3px;
        text-transform:uppercase
      }
      .heading:before,.heading:after {
        content:'';
        width:58px;
        height:1px;
        background:#26839a
      }
      .brand {
        width:330px;
        height:78px;
        margin:8px auto 16px;
        background-image:var(--reference);
        background-size:1672px 941px;
        background-position:-665px -174px;
        background-repeat:no-repeat;
        mix-blend-mode:multiply
      }
      body[data-theme=dark] .brand {
        mix-blend-mode:normal;
        border-radius:12px
      }
      .content {
        display:grid;
        grid-template-columns:558px 480px;
        gap:37px
      }
      .contacts {
        display:grid;
        gap:13px
      }
      .contact {
        min-height:100px;
        background:var(--tile);
        border:1px solid var(--line);
        border-radius:22px;
        padding:14px 24px 14px 21px;
        display:flex;
        align-items:center;
        gap:28px;
        box-shadow:0 4px 12px #006d7807;
        transition:transform .2s,box-shadow .2s
      }
      .contact:hover {
        transform:translateY(-2px);
        box-shadow:var(--shadow)
      }
      .icon {
        width:74px;
        height:72px;
        border-radius:30px;
        background:linear-gradient(135deg,#eaf8f9,#ddf4f4);
        color:#008696;
        display:grid;
        place-items:center;
        flex-shrink:0
      }
      .icon svg {
        width:36px;
        height:36px
      }
      .copy {
        flex:1;
        min-width:0
      }
      .label {
        display:block;
        text-transform:uppercase;
        letter-spacing:2.5px;
        font-size:13px;
        font-weight:700;
        margin-bottom:7px
      }
      .copy strong {
        display:block;
        font-size:28px;
        line-height:1.22;
        letter-spacing:-.4px
      }
      .address strong {
        font-size:24px;
        white-space:pre-line
      }
      .address {
        min-height:119px
      }
      .chevron {
        font-size:36px;
        font-weight:300;
        color:#91b6c7
      }
      .right-col {
        display:grid;
        grid-template-rows:208px 243px;
        gap:16px
      }
      .qr-card {
        display:flex;
        gap:25px;
        padding:18px 25px;
        align-items:center;
        border:1px solid var(--line);
        border-radius:21px;
        background:var(--tile);
        box-shadow:var(--shadow)
      }
      .qr-small {
        width:156px;
        height:156px;
        border-radius:17px;
        background:#fff;
        padding:7px;
        box-shadow:0 3px 15px #007e8b13;
        border:1px solid #e4f3f5;
        cursor:zoom-in
      }
      .qr-text {
        flex:1
      }
      .scan-heading {
        display:flex;
        align-items:center;
        gap:19px;
        font-size:20px;
        line-height:1.22;
        font-weight:600
      }
      .scan-icon {
        width:52px;
        height:52px;
        border-radius:50%;
        background:#dff4f3;
        color:#008a99;
        display:grid;
        place-items:center;
        flex-shrink:0
      }
      .qr-note {
        font-size:14px;
        line-height:1.4;
        margin:16px 0 0;
        padding-top:18px;
        border-top:1px solid var(--line)
      }
      .map {
        display:block;
        overflow:hidden;
        border:4px solid white;
        border-radius:20px;
        background:#effbfc;
        box-shadow:var(--shadow);
        transition:filter .2s
      }
      .map img {
        display:block;
        width:100%;
        height:100%;
        object-fit:contain
      }
      .map:hover {
        filter:saturate(1.4)
      }
      .actions {
        display:flex;
        justify-content:center;
        gap:26px;
        margin-top:32px
      }
      .action {
        height:72px;
        width:392px;
        border:1px solid #28a3b3;
        border-radius:21px;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:22px;
        font-size:20px;
        font-weight:700;
        background:transparent;
        color:var(--ink)
      }
      .action.primary {
        background:linear-gradient(110deg,#057c8e,#0198a2);
        color:#fff;
        box-shadow:0 10px 24px #00808f22
      }
      .action:hover {
        filter:brightness(1.06)
      }
      .action .chevron {
        color:inherit;
        font-size:30px
      }
      dialog {
        border:1px solid var(--line);
        background:var(--panel);
        color:var(--ink);
        border-radius:28px;
        padding:36px;
        text-align:center;
        box-shadow:0 24px 100px #001d3666;
        max-width:calc(100vw - 32px)
      }
      dialog::backdrop {
        background:#002b4266;
        backdrop-filter:blur(8px)
      }
      dialog img {
        width:320px;
        max-width:100%;
        border-radius:16px
      }
      dialog h2 {
        font-size:23px
      }
      dialog .action {
        width:100%;
        height:52px;
        margin-top:20px
      }
      dialog p {
        font-size:18px
      }
      @media(max-width:700px) {
        .stage {
          width:100%;
          height:auto;
          min-height:100vh;
          overflow:visible
        }
        .decor {
          display:none
        }
        .top {
          position:relative;
          top:auto;
          left:auto;
          right:auto;
          padding:16px;
          gap:10px
        }
        .backlink {
          padding:0 14px;
          font-size:16px;
          gap:5px
        }
        .controls {
          gap:8px
        }
        .languages button {
          padding:0 12px;
          font-size:16px
        }
        .glass {
          height:46px;
          border-radius:14px
        }
        .theme {
          width:44px
        }
        .panel {
          position:relative;
          left:auto;
          top:auto;
          width:auto;
          height:auto;
          margin:8px 14px 24px;
          padding:24px 17px;
          border-radius:28px
        }
        .heading {
          font-size:16px
        }
        .heading:before,.heading:after {
          width:35px
        }
        .brand {
          max-width:100%;
          margin-bottom:20px
        }
        .content {
          grid-template-columns:minmax(0,1fr);
          gap:18px
        }
        .contact {
          gap:15px;
          padding:14px;
          min-height:90px;
          border-radius:18px
        }
        .icon {
          width:54px;
          height:54px;
          border-radius:22px
        }
        .icon svg {
          width:29px;
          height:29px
        }
        .copy strong {
          font-size:clamp(18px,5vw,24px)
        }
        .address strong {
          font-size:20px
        }
        .label {
          font-size:11px
        }
        .chevron {
          font-size:28px
        }
        .right-col {
          grid-template-rows:auto 230px;
          gap:16px
        }
        .qr-card {
          gap:15px;
          padding:15px
        }
        .qr-small {
          width:124px;
          height:124px
        }
        .scan-heading {
          font-size:17px
        }
        .scan-icon {
          display:none
        }
        .qr-note {
          font-size:12px;
          padding-top:10px;
          margin-top:10px
        }
        .actions {
          flex-direction:column;
          gap:12px;
          margin-top:20px
        }
        .action {
          width:100%;
          height:60px;
          font-size:17px
        }
      }
      @media(prefers-reduced-motion:reduce) {
        * {
          transition:none!important
        }
      }
    
      /* Цветовая гамма исходной страницы. */
      :root {
        --ink: #083d42;
        --teal: #00727b;
        --panel: rgba(255, 255, 255, .30);
        --tile: rgba(255, 255, 255, .55);
        --line: rgba(0, 114, 123, .18);
        --shadow: 0 15px 40px rgba(0, 72, 78, .15);
      }
      body {
        background: radial-gradient(circle at 12% 18%, rgba(0,114,123,.16), transparent 29%),
                    radial-gradient(circle at 88% 78%, rgba(43,171,179,.13), transparent 31%),
                    linear-gradient(135deg, #ffffff 0%, #edf9f8 50%, #dff3f1 100%);
      }
      body[data-theme="dark"] {
        --ink: #f4ffff;
        --teal: #61dce4;
        --panel: rgba(8, 22, 25, .50);
        --tile: rgba(20, 47, 51, .76);
        --line: rgba(113, 225, 233, .20);
        --shadow: 0 15px 40px rgba(0, 0, 0, .38);
        background: radial-gradient(circle at 12% 18%, rgba(0,184,196,.16), transparent 29%),
                    radial-gradient(circle at 88% 78%, rgba(38,150,160,.13), transparent 31%),
                    linear-gradient(135deg, #020708 0%, #071518 50%, #0a2427 100%);
      }
      #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
      .stage { z-index: 1; }
      .decor { display: none; }
      .panel { border-color: var(--line); box-shadow: 0 40px 100px rgba(0,72,78,.15); }
      .heading, .label { color: var(--teal); }
      .icon { color: var(--teal); background: rgba(121,214,220,.15); }
      .action.primary, .languages button.active {
        background: linear-gradient(135deg, #00727b, #1696a0);
      }
      /* Логотип: обычный PNG рядом с HTML. */
      .brand, body[data-theme="dark"] .brand {
        background: none;
        mix-blend-mode: normal;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .brand img { display: block; width: 100%; height: 100%; object-fit: contain; }
      /* Карта заполняет всю рамку без пустых полос. */
      .map { padding: 0; overflow: hidden; }
      .map img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      /* Карта без внешней рамки. Увеличение скрывает белую кайму самого PNG. */
      .map {
        position: relative;
        border: 0;
        border-radius: 20px;
        padding: 0;
        background: transparent;
        box-shadow: none;
        overflow: hidden;
      }
      .map img {
        position: absolute;
        left: -3%;
        top: -3%;
        width: 106%;
        height: 106%;
        max-width: none;
        object-fit: cover;
        object-position: center;
      }
      /* Фоновые надписи не перекрывают контакты и не перехватывают нажатия. */
      .background-caption {
        position: absolute;
        z-index: 0;
        width: 184px;
        color: #8caab8;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 4px;
        line-height: 1.9;
        text-transform: uppercase;
        pointer-events: none;
        user-select: none;
      }
      .background-caption::after {
        content: "";
        display: block;
        width: 43px;
        height: 1px;
        margin-top: 17px;
        background: #398d9b;
      }
      .caption-top-left { top: 180px; left: 44px; }
      .caption-top-right { top: 245px; right: 20px; }
      .caption-bottom-left { bottom: 57px; left: 44px; }
      body[data-theme="dark"] .background-caption { color: #789ba1; }
      @media (max-width: 700px) {
        .background-caption { display: none; }
      }
    </style>
  </head>

      </p>
      <button class="action" id="closeQR" data-t="close">
      </button>
    </dialog>
    <!-- Переключение языка, темы, QR-код и масштабирование -->
    <script>
      
      const words= {
        ru: {
          back:'Назад',title:'Контакты',phone:'Телефон',email:'E-mail',addressLabel:'Адрес',address:'Санкт-Петербург,\nул. Лужская, д. 4, корпус 3',site:'Сайт',scan:'Сканируйте, чтобы перейти на сайт',note:'Свяжитесь с нами для консультации и подбора оборудования',open:'Перейти на сайт',showQR:'Показать QR-код',close:'Закрыть'
        }
        ,en: {
          back:'Back',title:'Contacts',phone:'Phone',email:'E-mail',addressLabel:'Address',address:'Saint Petersburg,\n4 Luzhskaya St., building 3',site:'Website',scan:'Scan to open the website',note:'Contact us for advice and help choosing equipment',open:'Visit website',showQR:'Show QR code',close:'Close'
        }
      }
      ;
      function read(k,d) {
        try {
          return localStorage.getItem(k)||d
        }
        catch {
          return d
        }
      }
      function save(k,v) {
        try {
          localStorage.setItem(k,v)
        }
        catch {
        }
      }
      function language(l) {
        if(!words[l])l='ru';
        document.documentElement.lang=l;
        document.title=l==='ru'?'НПК «АЗИМУТ» — Контакты':'NPK AZIMUT — Contacts';
        document.querySelectorAll('[data-t]').forEach(e=> {
          e.textContent=words[l][e.dataset.t]
        }
        );
        document.querySelectorAll('[data-lang]').forEach(e=> {
          e.classList.toggle('active',e.dataset.lang===l);e.setAttribute('aria-pressed',e.dataset.lang===l)
        }
        );
        document.querySelector('#theme').ariaLabel=l==='ru'?'Переключить тему':'Switch theme';
        save('npkLanguage',l)
      }
      document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>language(b.dataset.lang));
      language(read('npkLanguage','ru'));
      document.body.dataset.theme=read('npkTheme','light');
      document.querySelector('#theme').onclick=()=> {
        const t=document.body.dataset.theme==='dark'?'light':'dark';
        document.body.dataset.theme=t;
        save('npkTheme',t)
      }
      ;
      const dlg=document.querySelector('#qrDialog');
      document.querySelector('#showQR').onclick=document.querySelector('#qrSmall').onclick=()=>dlg.showModal();
      document.querySelector('#closeQR').onclick=()=>dlg.close();
      dlg.addEventListener('click',e=> {
        const r=dlg.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dlg.close()
      }
      );
      function resize() {
        const s=document.querySelector('#stage');
        if(innerWidth<=700) {
          s.style.transform='';
          s.style.margin='';
          document.body.style.height='';
          return
        }
        const z=Math.min(innerWidth/1672,innerHeight/941);
        s.style.transform='scale('+z+')';
        s.style.marginLeft=(innerWidth-1672*z)/2+'px';
        s.style.marginTop=Math.max(0,(innerHeight-941*z)/2)+'px';
        document.body.style.height=941*z+'px'
      }
      addEventListener('resize',resize);
      resize();
    
// Движущиеся частицы и связи на заднем плане.

const c=document.getElementById('particles'),ctx=c.getContext('2d');
let w,h,pts=[];
function init(){
  w=c.width=innerWidth;h=c.height=innerHeight;
  pts=Array.from({length:74},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*2+1}));
}
function draw(){
  ctx.clearRect(0,0,w,h);
  const dark=document.body.dataset.theme==='dark';
  ctx.fillStyle=dark?'rgba(113,225,233,.30)':'rgba(0,114,123,.30)';
  pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});
  ctx.strokeStyle=dark?'rgba(113,225,233,.09)':'rgba(0,114,123,.10)';
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    let a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<160){ctx.globalAlpha=1-d/160;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1}
  }
  requestAnimationFrame(draw);
}
window.addEventListener('resize',init);
init();draw();


    </script>
  </body>
</html>
