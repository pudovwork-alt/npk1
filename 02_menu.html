<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NPK — Интерактивное меню</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#00727B;--green2:#0A8D97;--green3:#6CC6CB;
  --text:#073D42;--muted:#4C6F73;--copy:#315d57;
  --glass:rgba(255,255,255,.70);--glass-soft:rgba(255,255,255,.26);
  --glass-hover:rgba(255,255,255,.38);--line:rgba(0,114,123,.22);
  --shadow:rgba(0,82,88,.13);--page-a:rgba(255,255,255,.98);--page-b:rgba(235,250,247,.97)
}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#f5fbfa;color:var(--text)}
body{
  background:radial-gradient(circle at 13% 18%,rgba(0,114,123,.16),transparent 31%),radial-gradient(circle at 86% 78%,rgba(0,114,123,.10),transparent 30%),linear-gradient(135deg,#fff 0%,#eefbf8 48%,#dff6f0 100%);
  transition:background .45s ease,color .35s ease
}
body[data-theme="dark"]{
  --green:#58D4DD;--green2:#28AAB4;--green3:#8FEAF0;
  --text:#F2FFFF;--muted:#A7C8CB;--copy:#C1DADC;
  --glass:rgba(12,28,31,.76);--glass-soft:rgba(10,25,28,.48);
  --glass-hover:rgba(18,40,44,.68);--line:rgba(117,226,233,.22);
  --shadow:rgba(0,0,0,.34);--page-a:rgba(5,13,15,.985);--page-b:rgba(8,27,30,.98);
  background:radial-gradient(circle at 13% 18%,rgba(0,173,184,.15),transparent 31%),radial-gradient(circle at 86% 78%,rgba(42,151,160,.13),transparent 30%),linear-gradient(135deg,#020708 0%,#071416 48%,#0A2023 100%)
}
button{font:inherit}
#particles{position:fixed;inset:0;z-index:0}.app{position:relative;z-index:2;width:1920px;height:1080px;padding:60px 90px;transform-origin:top left}
.topbar{position:absolute;left:54px;right:54px;top:34px;z-index:20;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.topbar>*{pointer-events:auto}.control-cluster{display:flex;align-items:center;gap:14px}
.glass-control{height:66px;border-radius:22px;border:1px solid var(--line);background:var(--glass-soft);color:var(--text);box-shadow:0 16px 42px var(--shadow),inset 0 1px 0 rgba(255,255,255,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:.3s ease}
.icon-button{width:66px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-button:hover{transform:translateY(-3px) scale(1.04);background:var(--glass-hover)}
.icon-button svg{width:31px;height:31px;fill:none;stroke:var(--green);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-button .sun-icon{display:none}body[data-theme="dark"] .theme-button .sun-icon{display:block}body[data-theme="dark"] .theme-button .moon-icon{display:none}
.language-switch{display:flex;align-items:center;padding:6px;gap:4px;height:66px}
.language-switch button{height:52px;min-width:68px;padding:0 18px;border:0;border-radius:17px;background:transparent;color:var(--muted);font-size:21px;font-weight:800;cursor:pointer;transition:.25s ease}
.language-switch button:hover{color:var(--text)}.language-switch button.active{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;box-shadow:0 9px 24px rgba(0,114,123,.25)}
#home{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}.logo-wrap{position:absolute;top:68px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;transition:.35s ease}.logo-img{width:450px;max-height:145px;object-fit:contain;filter:drop-shadow(0 18px 28px rgba(0,82,88,.15))}
body[data-theme="dark"] .logo-wrap{padding:12px 24px;border-radius:28px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(10px)}body[data-theme="dark"] .logo-img{filter:drop-shadow(0 20px 34px rgba(0,0,0,.45)) brightness(1.12)}
.menu{display:grid;grid-template-columns:560px 560px;grid-template-rows:315px 315px;gap:48px;transform:translateY(55px)}
.tile{border-radius:42px;padding:44px;position:relative;overflow:hidden;cursor:pointer;background:var(--glass-soft);border:1px solid var(--line);box-shadow:0 18px 55px rgba(0,82,88,.08),inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 55px rgba(255,255,255,.10);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);transition:.35s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tile:hover{transform:translateY(-12px) scale(1.04);background:var(--glass-hover);border-color:rgba(64,195,203,.42);box-shadow:0 34px 85px var(--shadow),0 0 42px rgba(0,114,123,.17),inset 0 1px 0 rgba(255,255,255,.24),inset 0 0 65px rgba(255,255,255,.11);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
.tile:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 18%,rgba(255,255,255,.46),transparent 42%),linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.03) 55%,transparent);opacity:.95;pointer-events:none}body[data-theme="dark"] .tile:before{opacity:.26}.tile:after{content:"";position:absolute;width:320px;height:320px;right:-90px;bottom:-120px;border-radius:50%;border:1px solid var(--line)}
.icon{position:relative;z-index:2;width:96px;height:96px;border-radius:30px;background:var(--glass-soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:34px;box-shadow:inset 0 0 24px rgba(255,255,255,.15),0 16px 32px var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.icon svg{width:52px;height:52px;stroke:var(--green);fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.tile h2{position:relative;z-index:2;font-size:48px;letter-spacing:.045em;line-height:1.15;text-transform:uppercase;color:var(--text)}
.arrow{position:absolute;right:34px;top:34px;z-index:2;width:58px;height:58px;border-radius:50%;background:var(--glass-soft);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--green);border:1px solid var(--line);box-shadow:inset 0 0 18px rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.page{display:none;position:absolute;inset:0;padding:126px 90px 62px;z-index:4;background:radial-gradient(circle at 85% 15%,rgba(0,114,123,.12),transparent 28%),linear-gradient(135deg,var(--page-a),var(--page-b));animation:fade .3s ease;transition:background .35s ease}.page.active{display:block}.back{display:inline-flex;align-items:center;gap:10px;font-size:24px;padding:16px 30px;border-radius:40px;background:var(--glass);border:1px solid var(--line);cursor:pointer;margin-bottom:34px;color:var(--text);box-shadow:0 18px 40px var(--shadow);transition:.3s ease}.back:hover{transform:translateY(-3px);background:var(--glass-hover);box-shadow:0 24px 50px var(--shadow)}.page h3{font-size:68px;margin-bottom:22px;color:var(--text)}.page-sub{font-size:30px;color:var(--muted);max-width:1080px;line-height:1.4;margin-bottom:44px}.content-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}.info-card{height:285px;border-radius:34px;background:var(--glass);border:1px solid var(--line);padding:36px;box-shadow:0 24px 70px var(--shadow);backdrop-filter:blur(14px)}.info-card b{font-size:36px;color:var(--green)}.info-card p{font-size:24px;line-height:1.38;color:var(--copy);margin-top:20px}.products{display:grid;grid-template-columns:1fr 1fr;gap:34px}.product-card{height:540px;border-radius:38px;background:var(--glass);border:1px solid var(--line);padding:42px;display:grid;grid-template-columns:42% 1fr;gap:30px;box-shadow:0 24px 70px var(--shadow);backdrop-filter:blur(14px)}.product-card img{width:100%;height:350px;object-fit:contain;align-self:center;filter:drop-shadow(0 20px 28px rgba(0,0,0,.12))}body[data-theme="dark"] .product-card img{filter:drop-shadow(0 22px 34px rgba(0,0,0,.38))}.product-card h4{font-size:40px;margin-bottom:18px;color:var(--text)}.product-card p,.product-card li{font-size:23px;line-height:1.36;color:var(--copy)}.product-card ul{margin-top:18px;padding-left:23px}.contact-box{height:610px;border-radius:38px;background:var(--glass);border:1px solid var(--line);padding:48px;font-size:32px;line-height:1.7;color:var(--copy);box-shadow:0 24px 70px var(--shadow);backdrop-filter:blur(14px)}
@keyframes fade{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}

.play-button {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--green), var(--green2));
  border: none;
  box-shadow: 0 12px 40px rgba(0, 114, 123, 0.40);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .3s ease;
  color: white;
}
.play-button:hover {
  transform: scale(1.10) translateY(-4px);
  box-shadow: 0 20px 60px rgba(0, 114, 123, 0.55);
}
.play-button svg {
  width: 40px;
  height: 40px;
  fill: white;
  margin-left: 6px;
}
body[data-theme="dark"] .play-button {
  box-shadow: 0 12px 40px rgba(0, 200, 210, 0.45);
}
body[data-theme="dark"] .play-button:hover {
  box-shadow: 0 20px 60px rgba(0, 200, 210, 0.65);
}
</style>
</head>
<body data-theme="light">
<canvas id="particles"></canvas>
<div class="app" id="app">
  <nav class="topbar" aria-label="Interface controls">
    <button class="play-button" type="button" onclick="location.href='01_start.html'" aria-label="Play" title="Начать">
      <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21 5,3" /></svg>
    </button>
    <div class="control-cluster">
      <button class="glass-control icon-button theme-button" type="button" onclick="toggleTheme()" aria-label="Тёмная тема" title="Тёмная тема">
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8 8 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5z"/></svg>
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <div class="glass-control language-switch" role="group" aria-label="Language">
        <button type="button" data-lang="ru" onclick="setLanguage('ru')">RU</button>
        <button type="button" data-lang="en" onclick="setLanguage('en')">EN</button>
      </div>
    </div>
  </nav>

  <section id="home">
    <div class="logo-wrap"><img class="logo-img" src="cropped-LogoAz-2.png" alt="Логотип" data-i18n-alt="logoAlt"></div>
    <div class="menu">
      <!-- О компании → 04_history.html -->
      <div class="tile" onclick="location.href='04_history.html'"><div class="arrow">→</div><div class="icon"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 10h.01M15 10h.01"/></svg></div><h2 data-i18n="menuAbout">О компании</h2></div>
      <!-- Продукция → 03_product.html -->
      <div class="tile" onclick="location.href='03_product.html'"><div class="arrow">→</div><div class="icon"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg></div><h2 data-i18n="menuProducts">Продукция</h2></div>
      <!-- Концепты → concept.html -->
      <div class="tile" onclick="location.href='concept.html'"><div class="arrow">→</div><div class="icon"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M8 14a6 6 0 1 1 8 0c-1.2.9-1.8 2-2 3h-4c-.2-1-1-2.1-2-3z"/></svg></div><h2 data-i18n="menuConcepts">Разработки</h2></div>
      <!-- Контакты → 05_contact1.html -->
      <div class="tile" onclick="location.href='05_contact1.html'"><div class="arrow">→</div><div class="icon"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 3 5.18 2 2 0 0 1 5 3h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.63 2.62a2 2 0 0 1-.45 2.11L9 10.6a16 16 0 0 0 4.4 4.4l1.15-1.15a2 2 0 0 1 2.11-.45c.84.3 1.72.51 2.62.63A2 2 0 0 1 22 16.92z"/></svg></div><h2 data-i18n="menuContacts">Контакты</h2></div>
    </div>
  </section>

  <!-- Все внутренние страницы удалены, оставлены пустые секции для совместимости -->
  <section class="page" id="about"></section>
  <section class="page" id="products"></section>
  <section class="page" id="concepts"></section>
  <section class="page" id="contacts"></section>
</div>
<script>
const translations={
  ru:{
    documentTitle:'NPK — Интерактивное меню',logoAlt:'Логотип',menuAbout:'О компании',menuProducts:'Продукция',menuConcepts:'Разработки',menuContacts:'Контакты'
  },
  en:{
    documentTitle:'NPK — Interactive Menu',logoAlt:'Company logo',menuAbout:'About us',menuProducts:'Products',menuConcepts:'Developments',menuContacts:'Contacts'
  }
};

let currentLanguage=localStorage.getItem('npkLanguage')||'ru';
let currentTheme=localStorage.getItem('npkTheme')||'light';
if(!translations[currentLanguage])currentLanguage='ru';
if(!['light','dark'].includes(currentTheme))currentTheme='light';

function scaleApp(){
  const app=document.getElementById('app');
  const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
  app.style.transform=`scale(${s})`;
  app.style.marginLeft=(window.innerWidth-1920*s)/2+'px';
  app.style.marginTop=(window.innerHeight-1080*s)/2+'px';
}
window.addEventListener('resize',scaleApp);

function applyTheme(){
  document.body.dataset.theme=currentTheme;
  const button=document.querySelector('.theme-button');
  const label=currentTheme==='dark'?translations[currentLanguage]?.lightLabel||'Светлая тема':translations[currentLanguage]?.darkLabel||'Тёмная тема';
  button.setAttribute('aria-label',label);
  button.title=label;
  localStorage.setItem('npkTheme',currentTheme);
}
function toggleTheme(){currentTheme=currentTheme==='dark'?'light':'dark';applyTheme()}

function setLanguage(lang){
  if(!translations[lang])return;
  currentLanguage=lang;
  const t=translations[lang];
  document.documentElement.lang=lang;
  document.title=t.documentTitle;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.dataset.i18n;if(t[key]!==undefined)el.textContent=t[key]});
  document.querySelectorAll('[data-i18n-alt]').forEach(el=>{const key=el.dataset.i18nAlt;if(t[key]!==undefined)el.alt=t[key]});
  document.querySelectorAll('.language-switch button').forEach(btn=>btn.classList.toggle('active',btn.dataset.lang===lang));
  localStorage.setItem('npkLanguage',lang);
  applyTheme();
}

const c=document.getElementById('particles'),ctx=c.getContext('2d');let w,h,pts=[];
function init(){w=c.width=innerWidth;h=c.height=innerHeight;pts=Array.from({length:68},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.32,vy:(Math.random()-.5)*.32,r:Math.random()*2+1}))}
function draw(){
  ctx.clearRect(0,0,w,h);
  const dark=document.body.dataset.theme==='dark';
  ctx.fillStyle=dark?'rgba(80,214,222,.40)':'rgba(0,114,123,.34)';
  pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});
  ctx.strokeStyle=dark?'rgba(80,214,222,.11)':'rgba(0,114,123,.10)';
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){let a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<160){ctx.globalAlpha=1-d/160;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1}}
  requestAnimationFrame(draw)
}
window.addEventListener('resize',init);
scaleApp();applyTheme();setLanguage(currentLanguage);init();draw();
</script>
</body>
</html>
