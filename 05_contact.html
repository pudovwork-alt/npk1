<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>НПК «АЗИМУТ» — Контакты</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --accent:#00727b;--accent2:#1696a0;--accent3:#79d6dc;
      --text:#083d42;--muted:#55757a;--body:#335d62;
      --glass:rgba(255,255,255,.62);--glass-soft:rgba(255,255,255,.30);
      --line:rgba(0,114,123,.18);--shadow:rgba(0,72,78,.15);--chip:rgba(255,255,255,.55)
    }
    html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--text)}
    body{
      background:radial-gradient(circle at 12% 18%,rgba(0,114,123,.16),transparent 29%),radial-gradient(circle at 88% 78%,rgba(43,171,179,.13),transparent 31%),linear-gradient(135deg,#ffffff 0%,#edf9f8 50%,#dff3f1 100%);
      transition:background .45s ease,color .35s ease
    }
    body[data-theme="dark"]{
      --accent:#61dce4;--accent2:#2eb3bd;--accent3:#a4f4f7;--text:#f4ffff;--muted:#a4c4c7;--body:#c7dcde;
      --glass:rgba(12,28,31,.72);--glass-soft:rgba(8,22,25,.50);--line:rgba(113,225,233,.20);--shadow:rgba(0,0,0,.38);--chip:rgba(20,47,51,.76);
      background:radial-gradient(circle at 12% 18%,rgba(0,184,196,.16),transparent 29%),radial-gradient(circle at 88% 78%,rgba(38,150,160,.13),transparent 31%),linear-gradient(135deg,#020708 0%,#071518 50%,#0a2427 100%)
    }
    button,a{font:inherit}
    #particles{position:fixed;inset:0;z-index:0;pointer-events:none}
    .app{position:relative;z-index:2;width:1920px;height:1080px;padding:40px 68px 48px;transform-origin:top left}
    .topbar{height:72px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:20}
    .controls{display:flex;align-items:center;gap:14px}
    .glass-button{height:64px;border-radius:21px;border:1px solid var(--line);background:var(--glass-soft);color:var(--text);box-shadow:0 15px 40px var(--shadow),inset 0 1px 0 rgba(255,255,255,.20);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:.28s ease}
    .back-button{display:flex;align-items:center;gap:13px;padding:0 25px;text-decoration:none;font-size:21px;font-weight:800;letter-spacing:.01em}
    .back-button svg,.icon-button svg,.flip-trigger svg{width:29px;height:29px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .glass-button:hover{transform:translateY(-3px);background:var(--glass);box-shadow:0 21px 48px var(--shadow),inset 0 1px 0 rgba(255,255,255,.25)}
    .icon-button{width:64px;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .theme-button .sun{display:none}body[data-theme="dark"] .theme-button .sun{display:block}body[data-theme="dark"] .theme-button .moon{display:none}
    .language-switch{height:64px;padding:6px;display:flex;align-items:center;gap:4px}
    .language-switch button{height:50px;min-width:66px;border:0;border-radius:16px;background:transparent;color:var(--muted);font-size:20px;font-weight:850;cursor:pointer;transition:.24s ease}
    .language-switch button:hover{color:var(--text)}
    .language-switch button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 10px 25px rgba(0,114,123,.25)}
    .main{height:905px;margin-top:18px;display:flex;align-items:center;justify-content:center}
    
    /* Главная карточка — единая большая плашка */
    .card-wrapper{width:960px;height:640px;perspective:1600px}
    .card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.9s cubic-bezier(.23,1,.32,1)}
    .card-inner.flipped{transform:rotateY(180deg)}
    .card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:48px;border:1px solid var(--line);background:var(--glass-soft);box-shadow:0 40px 100px var(--shadow),inset 0 1px 0 rgba(255,255,255,.20);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:48px 56px;overflow:hidden}
    .card-face::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.50),transparent 35%),linear-gradient(145deg,rgba(255,255,255,.12),transparent 50%);pointer-events:none;opacity:.7}
    body[data-theme="dark"] .card-face::before{opacity:.12}
    .card-face .shimmer{position:absolute;inset:-40% -50%;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.22) 48%,transparent 62%);transform:translateX(-55%) rotate(5deg);animation:shimmerMove 7s ease-in-out infinite;pointer-events:none}
    @keyframes shimmerMove{0%,20%{transform:translateX(-55%) rotate(5deg);opacity:0}32%{opacity:.7}58%{transform:translateX(55%) rotate(5deg);opacity:.12}100%{transform:translateX(55%) rotate(5deg);opacity:0}}
    
    /* Лицевая сторона — контакты */
    .front{display:flex;flex-direction:column;align-items:center}
    .front .header-center{display:flex;flex-direction:column;align-items:center;margin-bottom:16px;position:relative;z-index:2;width:100%}
    .front .eyebrow{display:flex;align-items:center;gap:13px;color:var(--accent2);font-size:20px;font-weight:850;letter-spacing:.17em;text-transform:uppercase}
    .front .eyebrow:before{content:"";width:48px;height:3px;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent3))}
    .front .logo-wrap{display:flex;justify-content:center;margin-top:8px;width:100%}
    .front .logo-wrap img{height:64px;width:auto;object-fit:contain}
    
    .front .contacts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:6px;position:relative;z-index:2;width:100%;flex:1;align-content:center}
    .front .contact-item{background:var(--chip);border-radius:24px;padding:24px 28px;border:1px solid var(--line);backdrop-filter:blur(6px);transition:all .25s ease;box-shadow:0 4px 12px rgba(0,0,0,.02);display:flex;flex-direction:column;justify-content:center}
    .front .contact-item:hover{transform:translateY(-3px);border-color:var(--accent);background:var(--glass);box-shadow:0 10px 28px var(--shadow)}
    .front .contact-label{font-size:14px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
    .front .contact-value{font-size:28px;font-weight:850;color:var(--text);word-break:break-word;line-height:1.2}
    .front .contact-value.address{font-size:24px}
    .front .contact-item.span2{grid-column:span 2}
    
    .front .footer-action{display:flex;align-items:center;justify-content:space-between;padding-top:20px;border-top:1px solid var(--line);position:relative;z-index:2;width:100%}
    .front .site-pill{display:inline-flex;padding:12px 24px;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:20px;font-weight:900;letter-spacing:.02em;box-shadow:0 12px 28px rgba(0,114,123,.20)}
    .front .flip-trigger{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:800;color:var(--accent2);cursor:pointer;transition:.25s ease;border:none;background:transparent;padding:10px 16px;border-radius:16px}
    .front .flip-trigger:hover{color:var(--accent);gap:16px;background:rgba(0,114,123,.06)}
    .front .flip-trigger svg{width:26px;height:26px;stroke:currentColor}
    
    /* Задняя сторона — QR-код */
    .back{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
    .back .qr-label{font-size:16px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--accent2);margin-bottom:12px;position:relative;z-index:2}
    .back .qr-wrap{position:relative;width:320px;height:320px;border-radius:32px;background:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(0,72,78,.20);position:relative;z-index:2}
    body[data-theme="dark"] .back .qr-wrap{background:#f5f9fa}
    .back .qr-wrap img{width:260px;height:260px;object-fit:contain;display:block}
    .back .qr-glow{position:absolute;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,rgba(121,214,220,.25),rgba(121,214,220,0) 65%);filter:blur(8px);animation:qrPulse 4.2s ease-in-out infinite;z-index:1}
    @keyframes qrPulse{50%{transform:scale(1.1);opacity:.6}}
    .back .scan-line{position:absolute;left:20px;right:20px;height:48px;top:-60px;background:linear-gradient(180deg,rgba(121,214,220,0),rgba(121,214,220,.25),rgba(121,214,220,0));filter:blur(6px);animation:scanMove 4.4s ease-in-out infinite;z-index:3;pointer-events:none}
    @keyframes scanMove{0%{top:-60px;opacity:0}10%{opacity:1}50%{top:140px;opacity:.9}100%{top:280px;opacity:0}}
    .back .qr-caption{font-size:26px;font-weight:900;color:var(--text);margin-top:24px;position:relative;z-index:2;text-align:center}
    .back .qr-url{font-size:20px;color:var(--muted);font-weight:700;margin-top:8px;position:relative;z-index:2}
    .back .back-hint{display:flex;align-items:center;gap:12px;margin-top:20px;font-size:18px;font-weight:800;color:var(--accent2);cursor:pointer;border:none;background:transparent;transition:.25s ease;position:relative;z-index:2;padding:10px 16px;border-radius:16px}
    .back .back-hint:hover{color:var(--accent);gap:16px;background:rgba(0,114,123,.06)}
    .back .back-hint svg{width:26px;height:26px;stroke:currentColor}
    
    @media(max-width:1800px){.card-wrapper{width:860px;height:600px}.front .contact-value{font-size:24px}.front .contact-value.address{font-size:20px}.front .site-pill{font-size:18px}.front .logo-wrap img{height:54px}}
  </style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="app" id="app">
  <header class="topbar">
    <a class="glass-button back-button" href="02_menu.html" data-i18n-title="backTitle">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/><path d="M21 12H9"/></svg>
      <span data-i18n="back">Назад</span>
    </a>
    <div class="controls">
      <button type="button" class="glass-button icon-button theme-button" onclick="toggleTheme()">
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7.2 7.2 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.3"/><path d="M12 2.5v2.1M12 19.4v2.1M4.6 4.6l1.5 1.5M17.9 17.9l1.5 1.5M2.5 12h2.1M19.4 12h2.1M4.6 19.4l1.5-1.5M17.9 6.1l1.5-1.5"/></svg>
      </button>
      <div class="glass-button language-switch" aria-label="Language selection">
        <button type="button" data-lang="ru" onclick="setLanguage('ru')">RU</button>
        <button type="button" data-lang="en" onclick="setLanguage('en')">EN</button>
      </div>
    </div>
  </header>
  <main class="main">
    <div class="card-wrapper">
      <div class="card-inner" id="cardInner">
        <!-- Лицевая сторона: контакты -->
        <div class="card-face front">
          <div class="shimmer"></div>
          <div class="header-center">
            <div class="eyebrow" data-i18n="eyebrow">Контакты</div>
            <div class="logo-wrap">
              <img src="cropped-LogoAz-2.png" alt="НПК АЗИМУТ" id="logoImg">
            </div>
          </div>
          <div class="contacts-grid">
            <div class="contact-item">
              <div class="contact-label" data-i18n="phoneLabel">Телефон</div>
              <div class="contact-value">+7 (812) 327-92-03</div>
            </div>
            <div class="contact-item">
              <div class="contact-label">E-mail</div>
              <div class="contact-value">info@npkazimut.ru</div>
            </div>
            <div class="contact-item span2">
              <div class="contact-label" data-i18n="addressLabel">Адрес</div>
              <div class="contact-value address" data-i18n="addressValue">Санкт-Петербург, ул. Лужская, д. 4, корпус 3</div>
            </div>
          </div>
          <div class="footer-action">
            <span class="site-pill">https://npkazimut.ru/</span>
            <button class="flip-trigger" onclick="toggleFlip()" id="flipTriggerFront">
              <span id="flipLabelFront" data-i18n="showQR">Показать QR‑код</span>
              <svg viewBox="0 0 24 24"><path d="M7 7h10v10M7 17L17 7"/><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
            </button>
          </div>
        </div>
        <!-- Задняя сторона: QR-код -->
        <div class="card-face back">
          <div class="qr-glow"></div>
          <div class="qr-label" data-i18n="qrTitle">QR-код</div>
          <div class="qr-wrap">
            <div class="scan-line"></div>
            <img src="qr-code.svg" alt="QR код для перехода на сайт">
          </div>
          <div class="qr-caption" data-i18n="qrAction">Сканируйте для перехода на сайт</div>
          <div class="qr-url">https://npkazimut.ru/</div>
          <button class="back-hint" onclick="toggleFlip()" id="flipTriggerBack">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v10M7 17L17 7"/><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
            <span id="flipLabelBack" data-i18n="showContacts">Показать контакты</span>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
const translations={
  ru:{
    documentTitle:'НПК «АЗИМУТ» — Контакты',back:'Назад',backTitle:'Вернуться в главное меню',
    eyebrow:'Контакты',phoneLabel:'Телефон',addressLabel:'Адрес',addressValue:'Санкт-Петербург, ул. Лужская, д. 4, корпус 3',
    qrTitle:'QR-код',qrAction:'Сканируйте для перехода на сайт',
    showQR:'Показать QR‑код',showContacts:'Показать контакты',
    darkLabel:'Тёмная тема',lightLabel:'Светлая тема'
  },
  en:{
    documentTitle:'NPK AZIMUT — Contacts',back:'Back',backTitle:'Return to the main menu',
    eyebrow:'Contacts',phoneLabel:'Phone',addressLabel:'Address',addressValue:'Saint Petersburg, Luzhskaya St., 4, building 3',
    qrTitle:'QR Code',qrAction:'Scan to open the website',
    showQR:'Show QR code',showContacts:'Show contacts',
    darkLabel:'Dark theme',lightLabel:'Light theme'
  }
};
let currentLanguage=localStorage.getItem('npkLanguage')||'ru';
let currentTheme=localStorage.getItem('npkTheme')||'light';
let flipped=false;
if(!translations[currentLanguage])currentLanguage='ru';
if(!['light','dark'].includes(currentTheme))currentTheme='light';

function scaleApp(){
  const app=document.getElementById('app');
  const scale=Math.min(innerWidth/1920,innerHeight/1080);
  app.style.transform=`scale(${scale})`;
  app.style.marginLeft=((innerWidth-1920*scale)/2)+'px';
  app.style.marginTop=((innerHeight-1080*scale)/2)+'px';
}
function applyTheme(){
  document.body.dataset.theme=currentTheme;
  const t=translations[currentLanguage];
  const button=document.querySelector('.theme-button');
  const label=currentTheme==='dark'?t.lightLabel:t.darkLabel;
  button.setAttribute('aria-label',label);button.title=label;
  localStorage.setItem('npkTheme',currentTheme);
}
function toggleTheme(){currentTheme=currentTheme==='dark'?'light':'dark';applyTheme()}
function refreshLabels(){
  const t=translations[currentLanguage];
  document.getElementById('flipLabelFront').textContent=flipped?t.showContacts:t.showQR;
  document.getElementById('flipLabelBack').textContent=flipped?t.showContacts:t.showQR;
}
function setLanguage(lang){
  if(!translations[lang])return;
  currentLanguage=lang;
  const t=translations[lang];
  document.documentElement.lang=lang;document.title=t.documentTitle;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.dataset.i18n;
    if(t[k]!==undefined)el.textContent=t[k];
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{
    const k=el.dataset.i18nTitle;
    if(t[k]!==undefined){el.title=t[k];el.setAttribute('aria-label',t[k])}
  });
  document.querySelectorAll('.language-switch button').forEach(btn=>btn.classList.toggle('active',btn.dataset.lang===lang));
  localStorage.setItem('npkLanguage',lang);
  applyTheme();
  refreshLabels();
}
function toggleFlip(){
  flipped=!flipped;
  document.getElementById('cardInner').classList.toggle('flipped',flipped);
  refreshLabels();
}
window.addEventListener('resize',scaleApp);
scaleApp();setLanguage(currentLanguage);applyTheme();

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')window.location.href='02_menu.html';
  if((e.key===' '||e.key==='Enter')&&(document.activeElement?.closest('.flip-trigger')||document.activeElement?.closest('.back-hint'))){
    e.preventDefault();toggleFlip();
  }
});

// Particles
const c=document.getElementById('particles'),ctx=c.getContext('2d');
let w,h,pts=[];
function init(){
  w=c.width=innerWidth;h=c.height=innerHeight;
  pts=Array.from({length:74},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*2+1}));
}
function draw(){
  ctx.clearRect(0,0,w,h);
  const dark=document.body.dataset.theme==='dark';
  ctx.fillStyle=dark?'rgba(113,225,233,.30)':'rgba(0,114,123,.30)';
  pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});
  ctx.strokeStyle=dark?'rgba(113,225,233,.09)':'rgba(0,114,123,.10)';
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    let a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<160){ctx.globalAlpha=1-d/160;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1}
  }
  requestAnimationFrame(draw);
}
window.addEventListener('resize',init);
init();draw();

// Обработка ошибки загрузки логотипа
document.getElementById('logoImg').addEventListener('error', function() {
  this.style.display = 'none';
});
</script>
</body>
</html>
