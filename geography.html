<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NPK — География поставок</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#00727B;--green2:#0A8D97;--green3:#6CC6CB;
  --text:#073D42;--muted:#4C6F73;--copy:#315d57;
  --glass:rgba(255,255,255,.70);--glass-soft:rgba(255,255,255,.26);
  --glass-hover:rgba(255,255,255,.38);--line:rgba(0,114,123,.22);
  --shadow:rgba(0,82,88,.13);
}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#f5fbfa;color:var(--text)}
body{
  background:radial-gradient(circle at 13% 18%,rgba(0,114,123,.16),transparent 31%),radial-gradient(circle at 86% 78%,rgba(0,114,123,.10),transparent 30%),linear-gradient(135deg,#fff 0%,#eefbf8 48%,#dff6f0 100%);
  transition:background .45s ease,color .35s ease
}
body[data-theme="dark"]{
  --green:#58D4DD;--green2:#28AAB4;--green3:#8FEAF0;
  --text:#F2FFFF;--muted:#A7C8CB;--copy:#C1DADC;
  --glass:rgba(12,28,31,.76);--glass-soft:rgba(10,25,28,.48);
  --glass-hover:rgba(18,40,44,.68);--line:rgba(117,226,233,.22);
  --shadow:rgba(0,0,0,.34);
  background:radial-gradient(circle at 13% 18%,rgba(0,173,184,.15),transparent 31%),radial-gradient(circle at 86% 78%,rgba(42,151,160,.13),transparent 30%),linear-gradient(135deg,#020708 0%,#071416 48%,#0A2023 100%)
}
button{font:inherit}
#particles{position:fixed;inset:0;z-index:0}
.app{position:relative;z-index:2;width:1920px;height:1080px;padding:60px 90px;transform-origin:top left}
.topbar{position:absolute;left:54px;right:54px;top:34px;z-index:20;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.topbar>*{pointer-events:auto}
.control-cluster{display:flex;align-items:center;gap:14px}
.glass-control{height:66px;border-radius:22px;border:1px solid var(--line);background:var(--glass-soft);color:var(--text);box-shadow:0 16px 42px var(--shadow),inset 0 1px 0 rgba(255,255,255,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:.3s ease}
.icon-button{width:66px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-button:hover{transform:translateY(-3px) scale(1.04);background:var(--glass-hover)}
.icon-button svg{width:31px;height:31px;fill:none;stroke:var(--green);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-button .sun-icon{display:none}
body[data-theme="dark"] .theme-button .sun-icon{display:block}
body[data-theme="dark"] .theme-button .moon-icon{display:none}
.language-switch{display:flex;align-items:center;padding:6px;gap:4px;height:66px}
.language-switch button{height:52px;min-width:68px;padding:0 18px;border:0;border-radius:17px;background:transparent;color:var(--muted);font-size:21px;font-weight:800;cursor:pointer;transition:.25s ease}
.language-switch button:hover{color:var(--text)}
.language-switch button.active{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;box-shadow:0 9px 24px rgba(0,114,123,.25)}

.page{
  display:block;
  position:absolute;
  inset:0;
  padding:110px 90px 40px;
  z-index:4;
  background:transparent !important;
  animation:fade .3s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}

/* Простой зеленый заголовок */
.page-title{
  font-size:56px;
  font-weight:900;
  color:var(--green);
  text-align:center;
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-bottom:14px;
  transition:color .35s ease;
}

.map-wrapper{
  position:relative;
  width:100%;
  height:calc(100% - 145px);
  background:transparent !important;
  display:flex;
  align-items:center;
  justify-content:center;
}
.map-wrapper img{
  width:92%;
  height:92%;
  object-fit:contain;
  display:block;
  opacity:0.85;
  filter:brightness(0.85) contrast(1.05);
  transition:filter .45s ease, opacity .45s ease;
}
body[data-theme="dark"] .map-wrapper img{
  opacity:0.7;
  filter:brightness(0.8) contrast(1.2);
}

/* Слой для лучей — 100% × 100% как и marker-group */
.rays-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:1;
}
.rays-layer svg{
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
}
.ray{
  stroke:var(--green);
  stroke-width:0.18;
  stroke-linecap:round;
  fill:none;
  stroke-dasharray:300;
  stroke-dashoffset:300;
  filter:drop-shadow(0 0 4px var(--green));
  opacity:0.85;
  animation: rayDraw 6s ease-out forwards;
}
.ray:nth-child(1){animation-delay:0.0s}
.ray:nth-child(2){animation-delay:0.4s}
.ray:nth-child(3){animation-delay:0.8s}
.ray:nth-child(4){animation-delay:1.2s}
.ray:nth-child(5){animation-delay:1.6s}
.ray:nth-child(6){animation-delay:2.0s}
.ray:nth-child(7){animation-delay:2.4s}
.ray:nth-child(8){animation-delay:2.8s}
.ray:nth-child(9){animation-delay:3.2s}
.ray:nth-child(10){animation-delay:3.6s}
.ray:nth-child(11){animation-delay:4.0s}
.ray:nth-child(12){animation-delay:4.4s}
.ray:nth-child(13){animation-delay:4.8s}
.ray:nth-child(14){animation-delay:5.2s}

@keyframes rayDraw{
  0%{stroke-dashoffset:300;opacity:0}
  20%{opacity:0.85}
  100%{stroke-dashoffset:0;opacity:0.85}
}

.marker-group{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:2;
}
.marker{
  position:absolute;
  width:24px;
  height:24px;
  margin-left:-12px;
  margin-top:-12px;
  animation: markerPulse 3s ease-in-out infinite;
}
.marker:nth-child(1){animation-delay:0.0s;left:29.9%;top:25.1%}
.marker:nth-child(2){animation-delay:0.3s;left:35.3%;top:35.8%}
.marker:nth-child(3){animation-delay:0.6s;left:75.9%;top:64.5%}
.marker:nth-child(4){animation-delay:0.9s;left:69.5%;top:76%}
.marker:nth-child(5){animation-delay:1.2s;left:59.3%;top:78.5%}
.marker:nth-child(6){animation-delay:1.5s;left:42.4%;top:75.3%}
.marker:nth-child(7){animation-delay:1.8s;left:30.1%;top:64.6%}
.marker:nth-child(8){animation-delay:2.1s;left:24%;top:62.6%}
.marker:nth-child(9){animation-delay:2.4s;left:19.2%;top:56%}
.marker:nth-child(10){animation-delay:2.7s;left:15.6%;top:58.7%}
.marker:nth-child(11){animation-delay:3.0s;left:11.3%;top:63.5%}
.marker:nth-child(12){animation-delay:3.3s;left:13.9%;top:45.3%}
.marker:nth-child(13){animation-delay:3.6s;left:16.9%;top:32.9%}
.marker:nth-child(14){animation-delay:3.9s;left:20.7%;top:26.7%}

.marker-dot{
  width:100%;height:100%;
  background:radial-gradient(circle at 30% 30%, var(--green3), var(--green));
  border-radius:50%;
  border:2px solid rgba(255,255,255,.8);
  box-shadow:0 0 20px rgba(0,114,123,.4),0 0 60px rgba(0,114,123,.15);
  animation: dotPulse 3s ease-in-out infinite;
}
.marker-ring{
  position:absolute;
  inset:-10px;
  border-radius:50%;
  border:2px solid var(--green);
  opacity:0.3;
  animation: ringExpand 3s ease-in-out infinite;
}
.marker-ring2{
  position:absolute;
  inset:-20px;
  border-radius:50%;
  border:1px solid var(--green);
  opacity:0.15;
  animation: ringExpand2 3s ease-in-out infinite;
}

@keyframes markerPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.1)}
}
@keyframes dotPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 20px rgba(0,114,123,.4),0 0 60px rgba(0,114,123,.15)}
  50%{transform:scale(1.2);box-shadow:0 0 30px rgba(0,114,123,.6),0 0 80px rgba(0,114,123,.25)}
}
@keyframes ringExpand{
  0%{transform:scale(1);opacity:0.3}
  100%{transform:scale(2.5);opacity:0}
}
@keyframes ringExpand2{
  0%{transform:scale(1);opacity:0.15}
  100%{transform:scale(3.5);opacity:0}
}

.marker-label{
  position:absolute;
  bottom:calc(100% + 16px);
  left:50%;
  transform:translateX(-50%);
  background:var(--glass);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  padding:6px 16px;
  border-radius:20px;
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
  border:1px solid var(--line);
  color:var(--text);
  box-shadow:0 8px 24px var(--shadow);
  pointer-events:none;
  opacity:0;
  transition:opacity .4s ease;
}
.marker:hover .marker-label{opacity:1}
.marker-label:after{
  content:'';
  position:absolute;
  top:100%;
  left:50%;
  transform:translateX(-50%);
  border:6px solid transparent;
  border-top-color:var(--glass);
}
/* Подпись под картой */
.delivery-note{
  margin-top:-8px;
  text-align:center;
  font-size:34px;
  font-weight:900;
  color:var(--green);
  letter-spacing:.02em;
  line-height:1.15;
  text-shadow:0 8px 24px rgba(0,114,123,.10);
  transition:color .35s ease;
}

</style>
</head>
<body data-theme="light">
<canvas id="particles"></canvas>
<div class="app" id="app">
  <nav class="topbar" aria-label="Interface controls">
    <a href="02_menu.html" class="glass-control icon-button" aria-label="Назад" title="Назад">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="control-cluster">
      <button class="glass-control icon-button theme-button" type="button" onclick="toggleTheme()" aria-label="Тёмная тема" title="Тёмная тема">
        <svg class="moon-icon" viewBox="0 0 24 24"><path d="M20.5 14.5A8 8 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5z"/></svg>
        <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <div class="glass-control language-switch" role="group" aria-label="Language">
        <button type="button" data-lang="ru" onclick="setLanguage('ru')">RU</button>
        <button type="button" data-lang="en" onclick="setLanguage('en')">EN</button>
      </div>
    </div>
  </nav>

  <section class="page">
    <h1 class="page-title" data-i18n="pageTitle">ГЕОГРАФИЯ ПОСТАВОК</h1>
    <div class="map-wrapper">
      <img src="map.png" alt="Карта поставок" data-i18n-alt="mapAlt" />

      <div class="rays-layer">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <path class="ray" d="M 21.6 32.1 C 23.2 26.5, 26.4 24.8, 29.9 25.1" />
          <path class="ray" d="M 21.6 32.1 C 26.1 31.1, 30.8 32.4, 35.3 35.8" />
          <path class="ray" d="M 21.6 32.1 C 34.2 37.6, 55.9 48.9, 75.9 64.5" />
          <path class="ray" d="M 21.6 32.1 C 32.1 43.7, 51.3 57.9, 69.5 76" />
          <path class="ray" d="M 21.6 32.1 C 29.4 46.9, 44.8 61.3, 59.3 78.5" />
          <path class="ray" d="M 21.6 32.1 C 25.5 46.7, 33.8 61.4, 42.4 75.3" />
          <path class="ray" d="M 21.6 32.1 C 22.4 43.5, 25.8 54.7, 30.1 64.6" />
          <path class="ray" d="M 21.6 32.1 C 20.8 42.7, 21.4 53.2, 24 62.6" />
          <path class="ray" d="M 21.6 32.1 C 19.6 41.2, 18.8 49.3, 19.2 56" />
          <path class="ray" d="M 21.6 32.1 C 17.2 42.3, 15.5 51.2, 15.6 58.7" />
          <path class="ray" d="M 21.6 32.1 C 14.4 43.6, 11.1 54.1, 11.3 63.5" />
          <path class="ray" d="M 21.6 32.1 C 16.4 36.1, 14.1 40.5, 13.9 45.3" />
          <path class="ray" d="M 21.6 32.1 C 19.3 31.6, 17.8 32, 16.9 32.9" />
          <path class="ray" d="M 21.6 32.1 C 20.9 29.3, 20.6 27.7, 20.7 26.7" />
        </svg>
      </div>

      <div class="marker-group">
        <div class="marker"><div class="marker-ring"></div><div class="marker-ring2"></div><div class="marker-dot"></div><div class="marker-label" data-i18n="marker1">Страна 1</div></div>
        <div class="marker"><div class="marker-ring"></div><div class="marker-ring2"></div><div class="marker-dot"></div><div class="marker-label" data-i18n="marker2">Страна 2</div></div>
        <div class="marker"><div class="marker-ring"></div><div class="marker-ring2"></div><div class="marker-dot"></div><div class="marker-label" data-i18n="marker3">Страна 3</div></div>
        <div class="marker"><div class="marker-ring"></div><div class="marker-ring2"></div><div class="marker-dot"></div><div class="marker-label" data-i18n="marker4">Страна 4</div></div>
        <div class="marker"><div class="marker-ring"></div><div class="marker-ring2"></div><div class="marker-dot"></div><div class="marker-label" data-i18n="marker5">Страна 5</div></div>
        <div class="marker"><div class="marker-ring"></div><div class="marker-ring2"></div><div class="marker-dot"></div><div class="marker-label" data-i18n="marker6">Страна 6</div></div>
        <div class="marker"><div class="marker-ring"></div><div class="marker-ring2"></div><div class="marker-dot"></div><div class="marker-label" data-i18n="marker7">Страна 7</div></div>
        <div class="marker"><div class="marker-ring"></div><div class="marker-ring2"></div><div class="marker-dot"></div><div class="marker-label" data-i18n="marker8">Страна 8</div></div>
        <div class="marker"><div class="marker-ring"></div><div class="marker-ring2"></div><div class="marker-dot"></div><div class="marker-label" data-i18n="marker9">Страна 9</div></div>
        <div class="marker"><div class="marker-ring"></div><div class="marker-ring2"></div><div class="marker-dot"></div><div class="marker-label" data-i18n="marker10">Страна 10</div></div>
        <div class="marker"><div class="marker-ring"></div><div class="marker-ring2"></div><div class="marker-dot"></div><div class="marker-label" data-i18n="marker11">Страна 11</div></div>
        <div class="marker"><div class="marker-ring"></div><div class="marker-ring2"></div><div class="marker-dot"></div><div class="marker-label" data-i18n="marker12">Страна 12</div></div>
        <div class="marker"><div class="marker-ring"></div><div class="marker-ring2"></div><div class="marker-dot"></div><div class="marker-label" data-i18n="marker13">Страна 13</div></div>
        <div class="marker"><div class="marker-ring"></div><div class="marker-ring2"></div><div class="marker-dot"></div><div class="marker-label" data-i18n="marker14">Страна 14</div></div>
      </div>
    </div>
    <div class="delivery-note" data-i18n="deliveryNote">Доставим в любой уголок страны!!</div>
  </section>
</div>
<script>
const translations={
  ru:{
    pageTitle:'ГЕОГРАФИЯ ПОСТАВОК',
    mapAlt:'Карта поставок',
    deliveryNote:'Доставим в любой уголок страны!!',
    marker1:'Страна 1',marker2:'Страна 2',marker3:'Страна 3',marker4:'Страна 4',
    marker5:'Страна 5',marker6:'Страна 6',marker7:'Страна 7',marker8:'Страна 8',
    marker9:'Страна 9',marker10:'Страна 10',marker11:'Страна 11',marker12:'Страна 12',
    marker13:'Страна 13',marker14:'Страна 14',
    darkLabel:'Тёмная тема',lightLabel:'Светлая тема'
  },
  en:{
    pageTitle:'DELIVERY GEOGRAPHY',
    mapAlt:'Delivery map',
    deliveryNote:'We deliver to every corner of the country!!',
    marker1:'Country 1',marker2:'Country 2',marker3:'Country 3',marker4:'Country 4',
    marker5:'Country 5',marker6:'Country 6',marker7:'Country 7',marker8:'Country 8',
    marker9:'Country 9',marker10:'Country 10',marker11:'Country 11',marker12:'Country 12',
    marker13:'Country 13',marker14:'Country 14',
    darkLabel:'Dark theme',lightLabel:'Light theme'
  }
};

let currentLanguage=localStorage.getItem('npkLanguage')||'ru';
let currentTheme=localStorage.getItem('npkTheme')||'light';
if(!translations[currentLanguage])currentLanguage='ru';
if(!['light','dark'].includes(currentTheme))currentTheme='light';

function scaleApp(){
  const app=document.getElementById('app');
  const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
  app.style.transform=`scale(${s})`;
  app.style.marginLeft=(window.innerWidth-1920*s)/2+'px';
  app.style.marginTop=(window.innerHeight-1080*s)/2+'px';
}
window.addEventListener('resize',scaleApp);

function applyTheme(){
  document.body.dataset.theme=currentTheme;
  const button=document.querySelector('.theme-button');
  const label=currentTheme==='dark'?translations[currentLanguage].lightLabel:translations[currentLanguage].darkLabel;
  button.setAttribute('aria-label',label);
  button.title=label;
  localStorage.setItem('npkTheme',currentTheme);
}
function toggleTheme(){currentTheme=currentTheme==='dark'?'light':'dark';applyTheme()}

function setLanguage(lang){
  if(!translations[lang])return;
  currentLanguage=lang;
  const t=translations[lang];
  document.documentElement.lang=lang;
  document.title=t.pageTitle+' — NPK';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    if(t[key]!==undefined)el.textContent=t[key];
  });
  document.querySelectorAll('[data-i18n-alt]').forEach(el=>{
    const key=el.dataset.i18nAlt;
    if(t[key]!==undefined)el.alt=t[key];
  });
  document.querySelectorAll('.language-switch button').forEach(btn=>btn.classList.toggle('active',btn.dataset.lang===lang));
  localStorage.setItem('npkLanguage',lang);
  applyTheme();
}

const c=document.getElementById('particles'),ctx=c.getContext('2d');let w,h,pts=[];
function init(){w=c.width=innerWidth;h=c.height=innerHeight;pts=Array.from({length:68},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.32,vy:(Math.random()-.5)*.32,r:Math.random()*2+1}))}
function draw(){
  ctx.clearRect(0,0,w,h);
  const dark=document.body.dataset.theme==='dark';
  ctx.fillStyle=dark?'rgba(80,214,222,.40)':'rgba(0,114,123,.34)';
  pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});
  ctx.strokeStyle=dark?'rgba(80,214,222,.11)':'rgba(0,114,123,.10)';
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){let a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<160){ctx.globalAlpha=1-d/160;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1}}
  requestAnimationFrame(draw)
}
window.addEventListener('resize',init);
scaleApp();applyTheme();setLanguage(currentLanguage);init();draw();
</script>
</body>
</html>
